server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: repomind

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:repomind}
    username: ${DB_USERNAME:repomind}
    password: ${DB_PASSWORD:repomind123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23liMS3rS8EhkfkIY5}
            client-secret: ${GITHUB_CLIENT_SECRET:c8dae2a171b556d4ce502300842664b6eb3b1840}
            scope: read:user,user:email

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

app:
  ai:
    provider: ${AI_PROVIDER:NVIDIA_DEV}
    nvidia:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${NVIDIA_API_KEY:}
  vector:
    qdrant:
      base-url: ${QDRANT_BASE_URL:http://qdrant:6333}
      collection: ${QDRANT_COLLECTION:repomind-embeddings}
      vector-size: ${QDRANT_VECTOR_SIZE:1024}
    embed:
      max-files: ${EMBED_MAX_FILES:450}
      chunk-size-chars: ${EMBED_CHUNK_SIZE_CHARS:900}
      chunk-overlap-chars: ${EMBED_CHUNK_OVERLAP_CHARS:120}
      max-chars-per-file: ${EMBED_MAX_CHARS_PER_FILE:2400}
