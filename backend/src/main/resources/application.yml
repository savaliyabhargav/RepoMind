server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: repomind

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:repomind}
    username: ${DB_USERNAME:repomind}
    password: ${DB_PASSWORD:repomind123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      compression-type: gzip
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.repomind.backend.*"
        spring.json.use.type.headers: true
    listener:
      ack-mode: manual

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23liMS3rS8EhkfkIY5}
            client-secret: ${GITHUB_CLIENT_SECRET:c8dae2a171b556d4ce502300842664b6eb3b1840}
            scope: read:user,user:email

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

app:
  ai:
    provider: ${AI_PROVIDER:NVIDIA_DEV}
    nvidia:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${NVIDIA_API_KEY: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}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    groq:
      api-key: ${GROQ_API_KEY:}
  analysis:
    max-duration-ms: ${ANALYSIS_MAX_DURATION_MS:120000}
    quality-profile: ${ANALYSIS_QUALITY_PROFILE:BALANCED}
    stage-ai-summary-enabled: ${ANALYSIS_STAGE_AI_SUMMARY_ENABLED:false}
    deep-pass:
      enabled: ${ANALYSIS_DEEP_PASS_ENABLED:true}
    annotation:
      ai-enrichment: ${ANNOTATION_AI_ENRICHMENT:false}
      ai-max-files: ${ANNOTATION_AI_MAX_FILES:40}
      ai-max-batches: ${ANNOTATION_AI_MAX_BATCHES:1}
