server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 20        # default is 200 — wastes ~180MB RAM on your 8GB machine
      min-spare: 5   # keep 5 warm, spin up more only if needed

spring:
  application:
    name: repomind

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:repomind}
    username: ${DB_USERNAME:repomind}
    password: ${DB_PASSWORD:repomind123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10  # 3 workers + 1 scheduler + 5 HTTP threads peak = ~9 max
      minimum-idle: 2        # keep 2 connections warm, release the rest
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500        # group inserts into batches of 500 instead of 1 per row
        order_inserts: true      # sort inserts by entity type so batches don't break mid-flight

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      compression-type: gzip
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.repomind.backend.*"
        spring.json.use.type.headers: true
        fetch.max.wait.ms: 100   # default 500ms — reduces worker pickup delay from ~400ms to ~100ms
        # Ingestion workers legitimately sleep between GitHub retries (rate limit +
        # transient backoff). Default 5min would evict the consumer mid-sleep and
        # redeliver the message — the cause of duplicate ingestion runs.
        max.poll.interval.ms: 600000
    listener:
      ack-mode: manual

  task:
    scheduling:
      pool:
        size: 2  # 1 for flushBuffer @Scheduled + 1 spare; default is 1

  security:
    oauth2:
      client:
        registration:
          github:
            # Values come from the environment (.env via docker-compose) — never
            # commit real credentials as defaults in this file.
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

app:
  github:
    # Personal access token for the GitHub REST API (repo metadata + tree fetch).
    # Without it GitHub allows only 60 requests/hour per IP — ingestion becomes
    # flaky as soon as a few repos are submitted. With a token: 5000/hour.
    token: ${GITHUB_TOKEN:}
  ai:
    provider: ${AI_PROVIDER:NVIDIA_DEV}
    nvidia:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${NVIDIA_API_KEY:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    groq:
      # Comma-separated list for key rotation; falls back to the single-key var.
      api-keys: ${GROQ_API_KEYS:${GROQ_API_KEY:}}
  analysis:
    max-duration-ms: ${ANALYSIS_MAX_DURATION_MS:120000}
    quality-profile: ${ANALYSIS_QUALITY_PROFILE:BALANCED}
    stage-ai-summary-enabled: ${ANALYSIS_STAGE_AI_SUMMARY_ENABLED:false}
    deep-pass:
      enabled: ${ANALYSIS_DEEP_PASS_ENABLED:true}
    annotation:
      ai-enrichment: ${ANNOTATION_AI_ENRICHMENT:false}
      ai-max-files: ${ANNOTATION_AI_MAX_FILES:40}
      ai-max-batches: ${ANNOTATION_AI_MAX_BATCHES:1}
