server:
  port: 8082

spring:
  application:
    name: repo-ingestion-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${REPO_DB_NAME:repo_db}
    username: ${DB_USERNAME:repomind}
    password: ${DB_PASSWORD:repomind123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      compression-type: gzip
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.repomind.ingestion.*"
        spring.json.use.type.headers: true
        fetch.max.wait.ms: 100
        max.poll.interval.ms: 600000
    listener:
      ack-mode: manual

  task:
    scheduling:
      pool:
        size: 2  # 1 for FileNodeBatchWriter's @Scheduled flush + 1 spare

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

app:
  github:
    token: ${GITHUB_TOKEN:}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
