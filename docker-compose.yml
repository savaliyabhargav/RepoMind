version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: repomind-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repomind-network

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: repomind-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repomind-network

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: repomind-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - repomind-network

  # ── Zookeeper ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: repomind-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - repomind-network

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: repomind-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - repomind-network

  # ── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: repomind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - repomind-network

  # ── PgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: repomind-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@repomind.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - repomind-network

  # ── Kafka UI ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: repomind-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: repomind
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    networks:
      - repomind-network

  # ── Auth service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: repomind-auth-service
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - repomind-network

  # ── Repo ingestion service ──────────────────────────────────────────────────
  repo-ingestion-service:
    build:
      context: ./backend
      dockerfile: repo-ingestion-service/Dockerfile
    container_name: repomind-repo-ingestion-service
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - repomind-network

  # ── Explain/diagram service ─────────────────────────────────────────────────
  explain-diagram-service:
    build:
      context: ./backend
      dockerfile: explain-diagram-service/Dockerfile
    container_name: repomind-explain-diagram-service
    env_file:
      - .env
    environment:
      INGESTION_SERVICE_URL: http://repo-ingestion-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      AI_PROVIDER_SERVICE_URL: http://ai-provider-service:8085
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      repo-ingestion-service:
        condition: service_started
      auth-service:
        condition: service_started
      ai-provider-service:
        condition: service_started
    networks:
      - repomind-network

  # ── Analysis service ─────────────────────────────────────────────────────────
  analysis-service:
    build:
      context: ./backend
      dockerfile: analysis-service/Dockerfile
    container_name: repomind-analysis-service
    env_file:
      - .env
    environment:
      INGESTION_SERVICE_URL: http://repo-ingestion-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      AI_PROVIDER_SERVICE_URL: http://ai-provider-service:8085
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      repo-ingestion-service:
        condition: service_started
      auth-service:
        condition: service_started
      ai-provider-service:
        condition: service_started
    networks:
      - repomind-network

  # ── AI provider service ─────────────────────────────────────────────────────
  ai-provider-service:
    build:
      context: ./backend
      dockerfile: ai-provider-service/Dockerfile
    container_name: repomind-ai-provider-service
    env_file:
      - .env
    ports:
      - "8085:8085"
    networks:
      - repomind-network

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repomind-frontend
    environment:
      # Inside the compose network each backend service resolves by its own name
      VITE_AUTH_SERVICE_TARGET: http://auth-service:8081
      VITE_INGESTION_SERVICE_TARGET: http://repo-ingestion-service:8082
      VITE_EXPLAIN_SERVICE_TARGET: http://explain-diagram-service:8083
      VITE_ANALYSIS_SERVICE_TARGET: http://analysis-service:8084
    ports:
      - "5173:5173"
    depends_on:
      - auth-service
      - repo-ingestion-service
      - explain-diagram-service
      - analysis-service
    networks:
      - repomind-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:

networks:
  repomind-network:
    driver: bridge